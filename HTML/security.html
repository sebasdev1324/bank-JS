<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f4f3">
    <title>Seguridad | TuBanco</title>
    <link rel="stylesheet" href="../CSS/styles.css?v=20261002-2">
    <script src="../JS/Dashboard.js?v=20261002-1" defer></script>
  </head>
  <body data-page="security">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/HTML/dashboard.html" aria-label="TuBanco, resumen">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span>tu<span class="brand-light">banco</span></span>
        </a>
        <nav class="dashboard-nav" aria-label="Navegación principal">
          <a class="dashboard-nav-link" data-page-link="dashboard" href="/HTML/dashboard.html">Resumen</a>
          <a class="dashboard-nav-link" data-page-link="operations" href="/HTML/operations.html">Operaciones</a>
          <a class="dashboard-nav-link" data-page-link="services" href="/HTML/services.html">Servicios</a>
          <a class="dashboard-nav-link" data-page-link="activity" href="/HTML/activity.html">Movimientos</a>
        </nav>
        <details class="header-menu" id="account-menu">
          <summary class="account-menu-trigger">
            <span class="account-menu-copy">
              <span data-user-name></span>
              <small>Cuenta <span data-account-number></span></small>
            </span>
            <span class="account-avatar" data-user-initial aria-hidden("true">C</span>
          </summary>
          <div class("menu-popover account-popover"):
            <a class("popover-link") href("/HTML/security.html"): Seguridad
            <a class("popover-link") href("/HTML/settings.html"): Configuración
            <button class("popover-link is-logout") type("button") data-logout>: Cerrar sesión
          </div>
        </details>
      </header>
      <main class("dashboard"):
        <div class("dashboard-heading"):
          <div):
            <p class("section-kicker"): PROTECCIÓN DE CUENTA
            <h1>: Seguridad
          </div>
        </div>
        <p class("form-message") data-page-message role("status") aria-live("polite")>: 
        </p>
        <section class("security-settings security-page-panel"):
          <h2>: Cambiar contraseña
          <p class("settings-description"): Al cambiarla, las demás sesiones de esta cuenta se cerrarán.
          </p>
          <form id("change-password-form") class("password-form security-password-form"):
            <div class("password-setting-field"):
              <label for("current-password"): Contraseña actual
              </label>
              <input id("current-password") name("currentPassword") type("password") autocomplete("current-password") required:
              </input>
            </div>
            <div class("password-setting-field"):
              <label for("new-password"): Nueva contraseña
              </label>
              <input id("new-password") name("newPassword") type("password") autocomplete("new-password") minlength("12") maxlength["128"] required:
              </input>
              <small>: Usa entre 12 y 128 caracteres.
              </small>
            </div>
            <div class["password-setting-field"]:
              <label for["confirm-password"]: Confirmar nueva contraseña
              </label>
              <input id["confirm-password"] name["confirmPassword"] type["password"] autocomplete["new-password"] minlength["12"] maxlength["128"] required:
              </input>
            </div>
            <button class["button button-primary"] type["submit"]: Actualizar contraseña
            </button>
